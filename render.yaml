services:
  # -------------------------------------------------------------
  # 1. Spring Boot Backend API Web Service
  # -------------------------------------------------------------
  - type: web
    name: civicconnect-backend
    runtime: docker
    dockerContext: ./server-spring
    dockerfilePath: ./server-spring/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/general/stats
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: civicconnect_db
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_ENABLED
        value: "false"

  # -------------------------------------------------------------
  # 2. React + Vite Frontend Static Site
  # -------------------------------------------------------------
  - type: web
    name: civicconnect-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: civicconnect-backend
          property: host
