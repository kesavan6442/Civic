server.port=${PORT:5000}
spring.application.name=civicconnect-server

# MongoDB Database Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/civicconnect_db}
spring.data.mongodb.database=${MONGODB_DATABASE:civicconnect_db}
spring.data.mongodb.auto-index-creation=true

# JWT Security Configurations
jwt.secret=${JWT_SECRET:9a3f2c4e8b1d7a6f5e0c3b2a1d4e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# External Python AI Service Configuration
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.enabled=${AI_SERVICE_ENABLED:true}
ai.service.api-key=${AI_SERVICE_API_KEY:civicconnect-ai-secret-key-2026}

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# File Upload Max Sizes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server Security
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.server-header=CivicConnect-Server

# Government of Jharkhand CivicConnect Meta
app.state=Government of Jharkhand
app.version=1.0.0
app.sla.default-days=90

# Model Context Protocol (MCP) Configuration
mcp.enabled=${MCP_ENABLED:true}
mcp.server-url=${MCP_SERVER_URL:http://localhost:5000/mcp}
mcp.token-expiry-days=${MCP_TOKEN_EXPIRY_DAYS:90}
mcp.allowed-origins=${MCP_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

